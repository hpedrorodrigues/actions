name: Setup Sphynx
author: Pedro Rodrigues
description: Set up Sphynx CLI.
branding:
  icon: award
  color: gray-dark
runs:
  using: composite
  steps:
    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@d3565f64e59130f1fd713440276f7d3e11079b88 # master
    - name: Install Sphynx
      run: brew install hpedrorodrigues/tools/sphynx
      shell: sh
